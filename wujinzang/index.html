<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="藤野京">
<meta name="description" content="无尽藏：一卷即时生成、永不重复的水墨长卷。一叶扁舟顺江东下，时辰节气从此刻开始推移。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>无尽藏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: the whole page is one full-bleed handscroll on a canvas; a vertical almanac and a column of seal-buttons sit at its right edge. One visual world (rice paper under changing light), so a single theme by design. */
:root{
  --paper:#f1e9d8;
  --paper-veil:rgba(241,233,216,.8);
  --ink:#1b1916;
  --ink-2:#4b453d;
  --cinnabar:#b4352a;
  --shade:rgba(27,25,22,.2);
  --font-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  --font-text:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:var(--font-text);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scroll{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scroll.drag{cursor:grabbing}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);right:calc(env(safe-area-inset-right,0px) + 22px);writing-mode:vertical-rl;display:flex;gap:4px;align-items:flex-start;font-family:var(--font-brush);color:var(--ink);pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.hud.on{opacity:.86}
.hud.night{color:var(--paper)}
.hud.night .sub{color:rgba(241,233,216,.78)}
.hud .term{font-size:28px;letter-spacing:.14em;line-height:1}
.hud .sub{font-size:16px;letter-spacing:.22em;color:var(--ink-2);line-height:1;padding-top:6px}
.hud .li{font-size:13px;letter-spacing:.16em;opacity:.8}

.controls{position:fixed;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .9s ease}
.controls.on{opacity:1;pointer-events:auto}
.controls.on.idle{opacity:.3}
.seal{width:40px;height:40px;padding:0;display:grid;place-items:center;border:1.5px solid var(--cinnabar);border-radius:5px;background:var(--paper-veil);color:var(--cinnabar);font-family:var(--font-brush);font-size:23px;line-height:1;cursor:pointer;transition:background-color .25s,color .25s,transform .15s}
.seal:hover{transform:translateY(-1px)}
.seal[aria-pressed="true"]{background:var(--cinnabar);color:var(--paper)}
.seal:focus-visible,.open:focus-visible,.close:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.intro{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .7s ease;opacity:0}
.intro.ready{opacity:1}
.intro.gone{opacity:0;pointer-events:none}
.open{font-family:var(--font-brush);font-size:30px;letter-spacing:.5em;text-indent:.5em;padding:11px 26px;color:var(--paper);background:var(--cinnabar);border:0;border-radius:4px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.open:hover{filter:brightness(1.06)}
.opt{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer;letter-spacing:.06em}
.opt input{accent-color:var(--cinnabar);width:15px;height:15px;margin:0}

.help{position:fixed;inset:0;display:grid;place-items:center;background:rgba(27,25,22,.22);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{max-width:430px;width:100%;box-sizing:border-box;background:var(--paper);color:var(--ink);border:1px solid var(--shade);box-shadow:0 14px 50px rgba(27,25,22,.22);padding:24px 26px 20px;font-size:14px;line-height:1.8}
.card h2{margin:0 0 6px;font-family:var(--font-brush);font-weight:400;font-size:30px;letter-spacing:.25em}
.card p{margin:6px 0;color:var(--ink-2)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:12px 0}
.card dt{font-family:var(--font-brush);font-size:18px;color:var(--cinnabar);line-height:1.5}
.card dd{margin:0;line-height:1.7}
.card .keys{font-size:12.5px;letter-spacing:.04em}
.card .credit{font-size:12.5px;letter-spacing:.08em;color:var(--ink-2);border-top:1px solid var(--shade);padding-top:8px;margin-top:10px}
.close{margin-top:8px;font-family:var(--font-brush);font-size:18px;letter-spacing:.3em;padding:6px 16px;border:1.5px solid var(--cinnabar);color:var(--cinnabar);background:transparent;border-radius:4px;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);max-width:calc(100% - 120px);font-size:13px;letter-spacing:.06em;color:var(--ink);background:var(--paper-veil);border:1px solid var(--shade);padding:7px 14px;border-radius:3px;opacity:0;transition:opacity .45s;pointer-events:none;text-align:center}
.toast.on{opacity:1}

@media (max-width:520px){
  .hud .term{font-size:23px}
  .hud .sub{font-size:14px}
  .seal{width:36px;height:36px;font-size:21px}
  .open{font-size:26px}
}
</style>
</head>
<body>
<canvas id="scroll" tabindex="0" aria-label="无尽藏：一卷即时生成的水墨长卷，一叶扁舟顺江而下。拖动或用左右方向键展卷，空格停舟。"></canvas>

<div class="hud" id="hud" aria-live="polite">
  <span class="term" id="hud-term"></span>
  <span class="sub" id="hud-sub"></span>
  <span class="sub li" id="hud-li"></span>
</div>

<nav class="controls" id="controls" aria-label="画卷">
  <button class="seal" id="b-sound" type="button" aria-pressed="false" title="声：开关声音（S）">声</button>
  <button class="seal" id="b-pause" type="button" aria-pressed="false" title="停舟 / 行舟（空格）">停</button>
  <button class="seal" id="b-poem" type="button" title="题一首诗（P）">诗</button>
  <button class="seal" id="b-stamp" type="button" title="钤印，存下此刻的画面" hidden>印</button>
  <button class="seal" id="b-help" type="button" title="说明">问</button>
</nav>

<div class="intro" id="intro">
  <button class="open" id="b-open" type="button">展卷</button>
  <label class="opt" for="c-sound"><input type="checkbox" id="c-sound" checked>有声（古琴与江声）</label>
</div>

<div class="help" id="help" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
  <div class="card">
    <h2 id="help-title">无尽藏</h2>
    <p>山水由程序即时画出：往前永不重复，往回仍是来时的江山。时辰与节气从你打开它的这一刻开始，顺流而下，晨昏、月相、风雨霜雪随之推移。</p>
    <dl>
      <dt>拖动</dt><dd>展卷，或回看来路</dd>
      <dt>长按</dt><dd>摇橹疾行</dd>
      <dt>点江</dt><dd>泛起涟漪，响一声琴</dd>
      <dt>点天</dt><dd>惊起几只飞鸟</dd>
      <dt>点舟</dt><dd>渔翁唱一句</dd>
      <dt>停</dt><dd>停舟片刻，渔翁便垂钓</dd>
      <dt>印</dt><dd>钤一方印，存下此刻</dd>
    </dl>
    <p class="keys">键盘：← 行舟 · → 回看 · 空格 停舟 · S 声 · P 诗</p>
    <p class="credit">制作 · 藤野京　　卷中题诗皆录自古人旧作</p>
    <button class="close" id="b-close" type="button">收起</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   utilities
   ===================================================================== */
const TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

const $ = s => document.querySelector(s);

function fbm2(x, y, oct, s, px) {

  for (let o = 0; o < oct; o++) { sum += a * vnoise2(x * f, y * f, s + o * 7919, px ? px * f : 0); n += a; a *= 0.5; f *= 2; }
  return sum / n;
}
function memo(fn, cap) {
  const m = new Map();
  const f = i => {
    let v = m.get(i);
    if (v === undefined) { v = fn(i); m.set(i, v); if (m.size > cap) m.delete(m.keys().next().value); }

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

   ===================================================================== */
const PAPER = [241, 233, 216], PAPER_CSS = 'rgb(241,233,216)';
const INKC = [22, 20, 18];
const ink = a => 'rgba(22,20,18,' + clamp(a, 0, 1).toFixed(3) + ')';
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
const OCHRE = [168, 108, 62], INDIGO = [56, 84, 108], MALACHITE = [86, 128, 108], CINNABAR = [182, 50, 38];
const BLOSSOM = [214, 112, 122], PLUMRED = [196, 64, 70], MAPLE = [178, 60, 38], LEAFGREEN = [70, 96, 76];
const BRUSH_FONT = '"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif';
const SEAL_FONT = '"ZCOOL QingKe HuangYou","Ma Shan Zheng",serif';
const TERMS = '立春雨水惊蛰春分清明谷雨立夏小满芒种夏至小暑大暑立秋处暑白露秋分寒露霜降立冬小雪大雪冬至小寒大寒'.match(/../g);
const SHICHEN = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const CW = 800, MARGIN = 28, Y_W = 668;
const CRUISE = reduceMotion ? 42 : 64;
const DAY_LEN = 17000, TERM_LEN = 5200;
let SEED = (Math.random() * 2147483647) | 0;

const canvas = $('#scroll');
const ctx = canvas.getContext('2d');

const S = {
  W: 1, H: 1, dpr: 1, k: 1, kCss: 1, oy: 0, Wu: 1, yTop: 0, yBot: 1000, quality: 1, fit: 1,
  cam: 0, v: 0, t: 0, started: false, opening: null,
  paused: false, rowing: false, keyFast: false, keyBack: false, dragging: false,
  CAM0: 2000, H0: 12, T0: 0, phase0: 0,
  L: null, Wx: null, mist: 0.3, wind: 0.3,
  stillT: 0, fastT: 0, backT: 0, fishing: 0, oar: 0, frameMs: 16,
  dbg: {},
};

/* =====================================================================
   time, light, season, weather — all functions of distance travelled
   ===================================================================== */
function initClock() {
  const now = new Date();
  S.H0 = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  const doy = (now - new Date(now.getFullYear(), 0, 1)) / 86400000;
  S.T0 = ((((doy - 34) / (365.2422 / 24)) % 24) + 24) % 24;
  const REF = Date.UTC(2000, 0, 6, 18, 14);
  S.phase0 = ((((now.getTime() - REF) / 86400000) / 29.530588853) % 1 + 1) % 1;
}
const camT = cam => Math.max(cam, S.CAM0) - S.CAM0;
const hourAt = cam => (S.dbg.hour != null ? S.dbg.hour : ((S.H0 + camT(cam) / DAY_LEN * 24) % 24 + 24) % 24);
const termAt = cam => (S.dbg.term != null ? S.dbg.term : ((S.T0 + camT(cam) / TERM_LEN) % 24 + 24) % 24);
const phaseAt = cam => (S.dbg.phase != null ? S.dbg.phase : ((S.phase0 + camT(cam) / DAY_LEN / 29.530588853) % 1 + 1) % 1);

function cwin(x, a, b, f) {
  const len = ((b - a) % 24 + 24) % 24, c = a + len / 2, hw = len / 2;
  let d = Math.abs((((x - c) % 24) + 24) % 24); if (d > 12) d = 24 - d;
  return 1 - smoothstep(hw - f, hw + f, d);
}
function lightAt(cam) {
  const h = hourAt(cam), term = termAt(cam);
  const dl = 12 + 2.5 * Math.cos(TAU * (term - 9) / 24);
  const rise = 12.15 - dl / 2, set = 12.15 + dl / 2;
  const day = smoothstep(rise - 0.75, rise + 0.85, h) * (1 - smoothstep(set - 0.85, set + 0.75, h));
  const dawn = Math.exp(-(((h - rise) / 0.95) ** 2));
  const dusk = Math.exp(-(((h - set) / 0.95) ** 2));
  const phase = phaseAt(cam);
  const mh = (((h - phase * 24.8 - 6.2) % 24) + 24) % 24;
  return { h, term, day, night: 1 - day, dawn, dusk, rise, set, phase, sunA: (h - rise) / (set - rise) * Math.PI, moonA: mh / 12.4 * Math.PI };
}
function seasonAt(cam) {
  const term = termAt(cam);
  return {
    term,
    bloom: cwin(term, 1.2, 4.6, 0.9),
    green: cwin(term, 2.4, 15.8, 1.5),
    lush: cwin(term, 6, 13, 1.6),
    autumn: cwin(term, 13.4, 19.4, 1.2),
    bare: cwin(term, 19.2, 2.2, 1.0),
    snowCover: cwin(term, 19.6, 1.3, 0.9),

function weatherAt(cam) {
  const ct = camT(cam), term = termAt(cam);
  let n = 0.5 + 0.55 * fbm1(ct / 7000 + 17.3, 3, SEED + 9);
  n += 0.85 * Math.exp(-(((ct - 9800) / 2600) ** 2));
  n -= 0.6 * Math.exp(-((ct / 2600) ** 2));

  if (S.dbg.snow != null) snow = S.dbg.snow;

  const wind = clamp(0.2 + 0.6 * (0.5 + 0.5 * noise1(ct / 5200 + 2.7, SEED + 4)) + 0.3 * (rain + snow), 0, 1);

/* =====================================================================
   brush primitives
   ===================================================================== */
function spline(pts, seg) {

// a tapered, slightly wobbling brush stroke along a path
function brush(g, pts, w, color, o) {

  const n = P.length; if (n < 2) return;

  for (let i = 1; i < n; i++) { len += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); cum[i] = len; }
  if (len < 0.05) return;

  const Lx = new Float32Array(n), Ly = new Float32Array(n), Rx = new Float32Array(n), Ry = new Float32Array(n);

const TEX = {};
function makeGrainTile(size) {
  const c = mkCanvas(size, size), g = c.getContext('2d');
  const img = g.createImageData(size, size), d = img.data, R = rng(777);
  for (let i = 0; i < size * size; i++) {
    const v = 255 - R() * 14 - (R() < 0.004 ? 34 * R() : 0);
    d[i * 4] = v; d[i * 4 + 1] = v - 1.5; d[i * 4 + 2] = v - 5; d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.lineCap = 'round';
  for (let k = 0; k < size * 0.45; k++) {
    const x = R() * size, y = R() * size, a = R() * TAU, l = 3 + R() * 14;
    g.strokeStyle = R() < 0.6 ? 'rgba(140,124,98,0.045)' : 'rgba(255,255,255,0.22)';
    g.lineWidth = 0.5 + R() * 0.6;
    for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]) {
      if ((ox || oy) && (x + ox < -l || x + ox > size + l || y + oy < -l || y + oy > size + l)) continue;
      g.beginPath(); g.moveTo(x + ox, y + oy);
      g.quadraticCurveTo(x + ox + Math.cos(a + 0.6) * l * 0.5, y + oy + Math.sin(a + 0.6) * l * 0.5, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l);
      g.stroke();
    }
  }
  return c;
}
function makeMistTex(seed, w, h, cells, color, lo, hi) {
  const c = mkCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) {
    const vy = y / h, env = Math.pow(Math.sin(Math.PI * vy), 1.15);
    for (let x = 0; x < w; x++) {
      const n = fbm2(x / w * cells, vy * 2.4 + 0.37, 4, seed, cells);

      d[i] = color[0]; d[i + 1] = color[1]; d[i + 2] = color[2]; d[i + 3] = a * 255;

}
function makeGlow(col, size) {

  gr.addColorStop(0, rgba(col, 1)); gr.addColorStop(0.16, rgba(col, 0.55)); gr.addColorStop(0.42, rgba(col, 0.13)); gr.addColorStop(1, rgba(col, 0));

}

const water = { rows: [] };
const waterP = y => 0.55 + (y - Y_W) * (0.77 / 332);
const BOAT = { x: 0, y: 786 };
function resize() {
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * S.quality;
  S.dpr = dpr;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  S.W = canvas.width; S.H = canvas.height;
  const aspect = cw / ch;
  S.fit = aspect < 1.05 ? clamp(aspect * 1.42, 0.6, 1) : 1;
  S.k = S.H / 1000 * S.fit; S.kCss = S.k / dpr;
  S.oy = (S.H - 1000 * S.k) * 0.4;
  S.Wu = S.W / S.k; S.yTop = -S.oy / S.k; S.yBot = (S.H - S.oy) / S.k;
  BOAT.x = S.Wu * (aspect < 1 ? 0.6 : 0.57);
  water.rows = [];
  const NR = 26;
  for (let k = 0; k < NR; k++) { const t = (k + 0.5) / NR, y = Y_W + 4 + (S.yBot - Y_W) * Math.pow(t, 1.35); water.rows.push({ y, p: waterP(y), k, near: t }); }
  TEX.refl = mkCanvas(S.W / 2, 220 * S.k / 2);
  clearCaches();
  buildOverlay();
  panel.canvas = null;
  if (Poem.cur) Poem.cur.blk = null;
}

function drawSeal(g, x, y, size, text, o) {

  g.moveTo(x + R.range(-j, j), y + R.range(-j, j)); g.lineTo(x + w + R.range(-j, j), y + R.range(-j, j));
  g.lineTo(x + w + R.range(-j, j), y + h + R.range(-j, j)); g.lineTo(x + R.range(-j, j), y + h + R.range(-j, j)); g.closePath();

  else { g.fillStyle = col; g.fill(); g.fillStyle = 'rgba(244,236,222,0.97)'; }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const put = (ch, cx, cy, fsz, sy) => { g.save(); g.translate(cx, cy); g.scale(1, sy || 1); g.font = `${fsz}px ${SEAL_FONT}`; g.fillText(ch, 0, fsz * 0.04); g.restore(); };
  if (o.tall) chars.forEach((ch, k) => put(ch, x + w / 2, y + h * (k + 0.5) / chars.length, w * 0.7, 0.95));
  else if (chars.length === 1) put(chars[0], x + w / 2, y + h / 2, size * 0.7);
  else if (chars.length === 2) { put(chars[0], x + w / 2, y + h * 0.28, size * 0.44, 0.98); put(chars[1], x + w / 2, y + h * 0.73, size * 0.44, 0.98); }
  else if (chars.length === 3) { put(chars[0], x + w * 0.73, y + h * 0.28, size * 0.42); put(chars[1], x + w * 0.73, y + h * 0.73, size * 0.42); put(chars[2], x + w * 0.27, y + h * 0.5, size * 0.44, 1.75); }
  else { put(chars[0], x + w * 0.73, y + h * 0.28, size * 0.42); put(chars[1], x + w * 0.73, y + h * 0.73, size * 0.42); put(chars[2], x + w * 0.27, y + h * 0.28, size * 0.42); put(chars[3], x + w * 0.27, y + h * 0.73, size * 0.42); }

  g.fill();

}

  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  if (!blob) { toast('这一幅没能存下'); return; }
  const name = `无尽藏-${term}-${sc}时.png`;
  if (downloadsNS) {
    try { await downloadsNS.save({ filename: name, data: blob }); toast('已钤印存图'); }
    catch (e) { const code = e && e.code; toast(code === 'declined' ? '已取消' : code === 'rate_limited' ? '稍等片刻再试' : '此处无法存图'); }
  } else if (!window.claude) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('已钤印存图');
  } else toast('此处无法存图');
});

const ptr = { down: false, id: 0, x0: 0, y0: 0, x: 0, lastX: 0, lastT: 0, t0: 0, moved: false, vel: 0, hold: 0 };
canvas.addEventListener('pointerdown', e => {
  if (!S.started || S.opening) return;
  wake();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  Object.assign(ptr, { down: true, id: e.pointerId, x0: e.clientX, y0: e.clientY, lastX: e.clientX, lastT: performance.now(), t0: performance.now(), moved: false, vel: 0 });
  clearTimeout(ptr.hold);
  ptr.hold = setTimeout(() => { if (ptr.down && !ptr.moved) { S.rowing = true; } }, 360);
});
canvas.addEventListener('pointermove', e => {
  if (S.started) wake();
  if (!ptr.down || e.pointerId !== ptr.id) return;
  const now = performance.now();
  if (!ptr.moved && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 7 && !S.rowing) { ptr.moved = true; S.dragging = true; canvas.classList.add('drag'); }
  if (ptr.moved) {
    const dx = e.clientX - ptr.lastX, dcam = dx / (S.kCss * 0.55), dtt = Math.max(1, now - ptr.lastT) / 1000;
    S.cam = Math.max(0, S.cam + dcam);
    ptr.vel = lerp(ptr.vel, dcam / dtt, 0.35);
  }
  ptr.lastX = e.clientX; ptr.lastT = now;
});
function endPtr(e) {
  if (!ptr.down || (e && e.pointerId !== ptr.id)) return;
  ptr.down = false; clearTimeout(ptr.hold);
  if (S.dragging) { S.dragging = false; canvas.classList.remove('drag'); S.v = clamp(performance.now() - ptr.lastT > 90 ? 0 : ptr.vel, -1600, 2400); }
  else if (!S.rowing && e && e.type === 'pointerup' && performance.now() - ptr.t0 < 360) onTap(e.clientX, e.clientY);
  S.rowing = false;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  if (!S.started || S.opening) return;
  e.preventDefault(); wake();
  const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? -e.deltaX : e.deltaY) * (e.deltaMode === 1 ? 16 : 1);
  S.cam = Math.max(0, S.cam + d / (S.kCss * 0.55) * 0.6);
}, { passive: false });
function onTap(cx, cy) {
  const xu = cx * S.dpr / S.k, yu = (cy * S.dpr - S.oy) / S.k;
  const bp = boatPose();
  if (Math.abs(xu - bp.x) < 64 && yu > bp.y - 46 && yu < bp.y + 14) {
    trigger('boat', 25); Sound.phrase(1.1);
    return;
  }
  if (yu > Y_W + 2) {
    fx.ripples.push({ v: xu - (S.cam * waterP(yu) + S.Wu / 2), y: yu, t0: S.t });
    Sound.tap(clamp(xu / S.Wu, 0, 1), clamp((yu - Y_W) / (S.yBot - Y_W), 0, 1));
    return;
  }
  spawnFlock('startle', { x: xu, y: yu, n: 4 + (Math.random() * 4 | 0) });
  Sound.chirps(clamp(xu / S.Wu, 0, 1));
}
window.addEventListener('keydown', e => {
  if (!help.hidden) { if (e.key === 'Escape') { help.hidden = true; bHelp.focus(); } return; }
  if (!S.started) { if (e.key === 'Enter' && document.activeElement === document.body) openScroll($('#c-sound').checked); return; }
  if (e.target && e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { S.keyFast = true; e.preventDefault(); }
  else if (k === 'arrowright' || k === 'd') { S.keyBack = true; e.preventDefault(); }
  else if (k === ' ') { setPaused(!S.paused); e.preventDefault(); }
  else if (k === 's') setSound(!Sound.on);
  else if (k === 'p') bPoem.click();
  wake();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') S.keyFast = false;
  if (k === 'arrowright' || k === 'd') S.keyBack = false;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) Sound.suspend(); else { Sound.resume(); last = performance.now(); } });
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(resize, 160); });

/* =====================================================================
   main loop, boot
   ===================================================================== */
let last = performance.now(), slowFor = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  const t0 = performance.now();
  update(dt);
  render();
  if (!S.started) {
    if (prefetch(10, true) && panel.fontsReady && !intro.classList.contains('ready')) intro.classList.add('ready');
  } else prefetch(6, false);
  const ms = performance.now() - t0;
  S.frameMs = lerp(S.frameMs, ms, 0.05);
  if (S.started && S.frameMs > 30) slowFor += dt; else slowFor = Math.max(0, slowFor - dt);
  if (slowFor > 3 && S.quality > 0.62) { S.quality = Math.max(0.6, S.quality - 0.15); slowFor = 0; resize(); }
  requestAnimationFrame(frame);
}
function boot(data) {
  data = data || {};
  initClock();
  if (data.seed) { SEED = data.seed; S.H0 = data.H0; S.T0 = data.T0; S.phase0 = data.phase0; }
  resize();
  S.CAM0 = data.CAM0 || S.Wu + 40;
  clearCaches();
  buildTextures();
  S.L = lightAt(0); S.Wx = weatherAt(0);
  setPaused(false);
  bSound.setAttribute('aria-pressed', 'false');
  if (!Sound.available) $('#c-sound').closest('label').hidden = true;
  if (data.started) {
    S.started = true; S.cam = data.cam || S.CAM0; S.v = CRUISE;
    intro.classList.add('gone'); hud.classList.add('on'); controls.classList.add('on'); panel.fontsReady = true;
  }
  const lk = document.querySelector('link[rel=stylesheet][href*="fonts.googleapis"]');
  const sheet = lk && !lk.sheet ? new Promise(r => { lk.addEventListener('load', r); lk.addEventListener('error', r); setTimeout(r, 2500); }) : Promise.resolve();
  sheet.then(() => fontsFor('无尽藏清风明月' + EPIGRAPH.join('') + '苏轼赤壁赋丙午孟冬藤野京作此卷与君共适一叶︽︾' + TERMS.join('') + SHICHEN.join('') + '时晴雨雪微雾月夜·')).then(() => {
    panel.fontsReady = true; panel.canvas = null;
    const t0 = performance.now();
    const fadeIn = () => { panel.alpha = clamp((performance.now() - t0) / 900, 0, 1); if (panel.alpha < 1) requestAnimationFrame(fadeIn); };
    fadeIn();
  });
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
    try { window.claude.hot.snapshot(() => ({ cam: S.cam, started: S.started, seed: SEED, H0: S.H0, T0: S.T0, phase0: S.phase0, CAM0: S.CAM0 })); } catch (e) { /* optional */ }
  }
  window.__wjz = {
    S, set(o) { Object.assign(S.dbg, o); clearCaches(); }, open: openScroll, poem: t => showPoem(POEMS.find(p => p.t === t) || choosePoem()), flock: spawnFlock,
    bench() {
      const out = {};
      for (const def of LAYERS) { const t0 = performance.now(); let n = 0; for (let i = -40; i > -52; i--) { buildChunk(def, i); n++; } out[def.name] = +((performance.now() - t0) / n).toFixed(1); }
      return out;
    },
    goNear(kind, fx) {
      const i0 = Math.floor(-(S.cam * NEAR.p) / CW);
      for (let i = i0 - 1; i > i0 - 400; i--) for (const o of nearObjs(i)) if (!kind || o.kind === kind) { S.cam = ((fx == null ? 0.3 : fx) * S.Wu - S.Wu / 2 - o.u) / NEAR.p; return o.kind; }
      return null;
    },
  };
  last = performance.now();
  requestAnimationFrame(frame);
}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
